version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule: { interval: monthly }
    target-branch: develop
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: monthly }
    target-branch: develop
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    target-branch: develop
