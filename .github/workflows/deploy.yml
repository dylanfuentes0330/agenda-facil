# Despliegue continuo a AWS (AWS Academy Learner Lab).
#
# Condiciones:
#   - Se dispara cuando el workflow "CI" termina con éxito sobre la rama main,
#     o manualmente (workflow_dispatch) indicando opcionalmente un commit/tag (rollback).
#   - Solo se ejecuta si la variable de repositorio AWS_DEPLOY_ENABLED = 'true'
#     (Settings → Secrets and variables → Actions → Variables). Así el pipeline no
#     falla mientras la infraestructura AWS aún no existe.
#
# Seguridad (el repositorio es público): el job "authorize" NO usa secretos ni el entorno
# production y decide qué commit se despliega. Los jobs con secretos solo corren si él aprueba:
#   - workflow_run: solo si CI se ejecutó por un PUSH a main de ESTE repositorio (nunca por un
#     pull_request ni desde un fork, aunque la rama del fork se llame "main") y el commit está en main.
#   - workflow_dispatch: solo lanzado desde main; la referencia indicada debe resolver a un commit
#     contenido en main (sirve para rollback a una versión anterior, nunca para código de otra rama).
#   - El checkout de los jobs de despliegue usa el SHA validado, no la entrada del usuario.
# Protección adicional obligatoria en GitHub (Settings → Environments → production):
#   revisores obligatorios + "Deployment branches: main" y guardar los secretos de despliegue como
#   secretos DEL ENTORNO (no del repositorio), para que solo estén disponibles tras la aprobación.
#
# Secretos requeridos (Settings → Secrets and variables → Actions → Secrets):
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN  → SOLO en modo CloudFront: credenciales
#       TEMPORALES del Learner Lab ("AWS Details"). Caducan al terminar la sesión: actualizarlas antes de desplegar.
#   EC2_HOST          → IP elástica o DNS público de la instancia EC2
#   EC2_SSH_KEY       → contenido de la llave privada (labsuser.pem / vockey)
#   PROD_DATABASE_URL → mysql://usuario_app:CLAVE@endpoint-rds:3306/agenda_facil
#   PROD_JWT_SECRET   → secreto aleatorio de 48+ bytes
# Variables (no secretas):
#   AWS_REGION (us-east-1), S3_UPLOADS_BUCKET, PUBLIC_ORIGIN (https://tudominio.com, https://dxxxx.cloudfront.net
#   o https://<ip>.sslip.io), TRUST_PROXY (proxies delante de Express: 2 = CloudFront + Nginx, valor por
#   defecto; 1 = solo Nginx). Modo CloudFront: S3_FRONTEND_BUCKET y CLOUDFRONT_DISTRIBUTION_ID.
#   Si CLOUDFRONT_DISTRIBUTION_ID está vacía (Learner Labs que bloquean CloudFront, EnableCloudFront=false)
#   el frontend se publica en la propia EC2 por SSH y no se necesitan credenciales de AWS en GitHub.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit, tag o rama a desplegar (vacío = main). Úsalo para hacer rollback.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  authorize:
    name: Autorizar origen del despliegue
    # Sin secretos ni entorno: valida el origen antes de que ningún job pueda leer secretos.
    if: >-
      vars.AWS_DEPLOY_ENABLED == 'true' &&
      (
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.head_repository.full_name == github.repository &&
         github.event.workflow_run.repository.full_name == github.repository) ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      )
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Resolver y validar el commit a desplegar
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_REF: ${{ github.event.inputs.ref }}
        run: |
          set -euo pipefail
          MAIN_SHA=$(git rev-parse HEAD)
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            CANDIDATE="$RUN_HEAD_SHA"
          elif [ -z "$INPUT_REF" ]; then
            CANDIDATE="$MAIN_SHA"
          else
            # Solo caracteres válidos de refs/SHA; evita opciones ("-…") y expresiones de git.
            if ! printf '%s' "$INPUT_REF" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]{0,99}$'; then
              echo "::error::Referencia no permitida: $INPUT_REF"
              exit 1
            fi
            CANDIDATE="$INPUT_REF"
          fi
          SHA=$(git rev-parse --verify --quiet "${CANDIDATE}^{commit}") || {
            echo "::error::La referencia no existe en este repositorio: $CANDIDATE"
            exit 1
          }
          if ! git merge-base --is-ancestor "$SHA" "$MAIN_SHA"; then
            echo "::error::El commit $SHA no pertenece a main; solo se despliegan commits de main."
            exit 1
          fi
          echo "Commit autorizado: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend → EC2
    needs: authorize
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false
      - name: Empaquetar backend
        run: |
          git rev-parse --short HEAD > backend/REVISION
          tar --exclude=node_modules --exclude=uploads --exclude=tests --exclude=.env -czf backend.tar.gz backend infra/aws/ec2/remote-deploy.sh infra/aws/ec2/rollback.sh
      - name: Configurar SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
      - name: Copiar paquete y desplegar
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          PROD_JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
          S3_UPLOADS_BUCKET: ${{ vars.S3_UPLOADS_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
          TRUST_PROXY: ${{ vars.TRUST_PROXY || '2' }}
        run: |
          SSH_OPTS=(-i ~/.ssh/deploy_key)
          TARGET="ec2-user@$EC2_HOST"
          scp "${SSH_OPTS[@]}" backend.tar.gz "$TARGET:/tmp/backend.tar.gz"
          # El archivo de entorno se envía por stdin (no queda en el historial de comandos ni en los logs).
          # Valores entre comillas simples: válidos para systemd (EnvironmentFile) y para bash (source).
          # La contraseña dentro de PROD_DATABASE_URL debe ir codificada para URL y sin comillas simples.
          printf "NODE_ENV=production\nPORT=3000\nDATABASE_URL='%s'\nJWT_SECRET='%s'\nJWT_EXPIRES_IN=8h\nCORS_ORIGINS='%s'\nTRUST_PROXY='%s'\nRATE_LIMIT_AUTH_MAX=20\nSTORAGE_DRIVER=s3\nS3_BUCKET='%s'\nAWS_REGION='%s'\nAPP_VERSION='%s'\n" \
            "$PROD_DATABASE_URL" "$PROD_JWT_SECRET" "$PUBLIC_ORIGIN" "$TRUST_PROXY" "$S3_UPLOADS_BUCKET" "$AWS_REGION" "$(cat backend/REVISION)" \
            | ssh "${SSH_OPTS[@]}" "$TARGET" 'sudo install -m 600 -o agenda -g agenda /dev/stdin /etc/agenda-facil/api.env'
          ssh "${SSH_OPTS[@]}" "$TARGET" 'rm -rf /tmp/agenda-deploy && mkdir -p /tmp/agenda-deploy && tar -xzf /tmp/backend.tar.gz -C /tmp/agenda-deploy && sudo bash /tmp/agenda-deploy/infra/aws/ec2/remote-deploy.sh /tmp/agenda-deploy/backend'
      - name: Verificar salud de la API
        env:
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
        run: |
          for _ in $(seq 1 10); do curl -sf "$PUBLIC_ORIGIN/api/health" && exit 0; sleep 6; done
          echo "::error::La API no respondió correctamente en $PUBLIC_ORIGIN/api/health"
          exit 1

  frontend:
    name: Frontend → S3 + CloudFront (o EC2)
    needs: [authorize, backend]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Credenciales AWS (temporales del Learner Lab)
        if: vars.CLOUDFRONT_DISTRIBUTION_ID != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Publicar en S3
        if: vars.CLOUDFRONT_DISTRIBUTION_ID != ''
        env:
          BUCKET: ${{ vars.S3_FRONTEND_BUCKET }}
        run: |
          aws s3 sync frontend/dist "s3://$BUCKET" --delete --exclude index.html \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp frontend/dist/index.html "s3://$BUCKET/index.html" --cache-control "no-cache"
      - name: Invalidar caché de CloudFront
        if: vars.CLOUDFRONT_DISTRIBUTION_ID != ''
        env:
          DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/index.html" "/"
      - name: Publicar en EC2 (sin CloudFront; Nginx sirve el frontend)
        if: vars.CLOUDFRONT_DISTRIBUTION_ID == ''
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          SSH_OPTS=(-i ~/.ssh/deploy_key)
          TARGET="ec2-user@$EC2_HOST"
          tar -czf frontend.tar.gz frontend/dist infra/aws/ec2/remote-frontend.sh
          scp "${SSH_OPTS[@]}" frontend.tar.gz "$TARGET:/tmp/frontend.tar.gz"
          ssh "${SSH_OPTS[@]}" "$TARGET" 'rm -rf /tmp/agenda-frontend && mkdir -p /tmp/agenda-frontend && tar -xzf /tmp/frontend.tar.gz -C /tmp/agenda-frontend && sudo bash /tmp/agenda-frontend/infra/aws/ec2/remote-frontend.sh /tmp/agenda-frontend/frontend/dist'
      - name: Verificar sitio
        env:
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
        run: curl -sf -o /dev/null -w "HTTP %{http_code}\n" "$PUBLIC_ORIGIN/"
